name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: startsWith(github.ref, 'refs/tags/')
        run: npm run release:check-version -- "$GITHUB_REF_NAME"
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run typecheck
      - run: npm run build

  macos:
    needs: quality
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    env:
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require signing and notarization credentials
        run: test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_API_KEY_BASE64" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER"
      - name: Prepare App Store Connect API key
        run: |
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - run: npm -w apps/desktop run make -- --mac --${{ matrix.arch }}
      - name: Smoke test packaged app and deep link
        run: |
          executable=$(find apps/desktop/dist -type f -path '*/LeagueLore Import Helper.app/Contents/MacOS/LeagueLore Import' -print -quit)
          test -n "$executable"
          "$executable" --smoke-test "leaguelore-import://start?apiBase=https%3A%2F%2Fportal.leagueloreapp.com&token=smoke-token&importSessionId=smoke-session&leagueId=424242&season=2025"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
          if-no-files-found: error

  windows:
    needs: quality
    runs-on: windows-latest
    env:
      # The current Windows distribution policy is intentionally unsigned.
      # This prevents a certificate installed on the runner from being selected accidentally.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build intentionally unsigned Windows installer
        run: npm -w apps/desktop run make -- --win --x64
      - name: Smoke test packaged app and deep link
        shell: bash
        run: |
          "apps/desktop/dist/win-unpacked/LeagueLore Import Helper.exe" --smoke-test "leaguelore-import://start?apiBase=https%3A%2F%2Fportal.leagueloreapp.com&token=smoke-token&importSessionId=smoke-session&leagueId=424242&season=2025"
      - name: Verify Windows binaries are unsigned and clearly labeled
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/dist -Filter '*-UNSIGNED.exe' -File | Select-Object -First 1
          if (-not $installer) {
            throw 'The unsigned Windows installer was not produced with the required -UNSIGNED suffix.'
          }

          $executables = @(
            'apps/desktop/dist/win-unpacked/LeagueLore Import Helper.exe',
            $installer.FullName
          )
          foreach ($executable in $executables) {
            $signature = Get-AuthenticodeSignature -LiteralPath $executable
            if ($signature.Status -ne 'NotSigned') {
              throw "Expected $executable to be intentionally unsigned, but signature status was $($signature.Status)."
            }
          }

          Copy-Item docs/WINDOWS-UNSIGNED-NOTICE.txt apps/desktop/dist/WINDOWS-UNSIGNED-NOTICE.txt
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-unsigned
          path: |
            apps/desktop/dist/*-UNSIGNED.exe
            apps/desktop/dist/WINDOWS-UNSIGNED-NOTICE.txt
          if-no-files-found: error

  linux:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm -w apps/desktop run make -- --linux --x64
      - name: Smoke test packaged app and deep link
        run: |
          xvfb-run "apps/desktop/dist/linux-unpacked/leaguelore-import-helper" --smoke-test "leaguelore-import://start?apiBase=https%3A%2F%2Fportal.leagueloreapp.com&token=smoke-token&importSessionId=smoke-session&leagueId=424242&season=2025"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-artifacts
        run: find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RELEASE_NOTICE: |
            > [!WARNING]
            > **The Windows installer is intentionally unsigned.** Windows Defender SmartScreen will show an unknown-publisher warning, and managed computers may block it. Only download the `-UNSIGNED.exe` from this official repository and verify it against `SHA256SUMS.txt`. macOS release artifacts remain signed and notarized.
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* SHA256SUMS.txt --verify-tag --generate-notes --notes "$WINDOWS_RELEASE_NOTICE" --title "LeagueLore Import Helper $GITHUB_REF_NAME"
